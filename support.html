<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - Pixxy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div class="max-w-2xl mx-auto px-4 py-16">
        <a href="index.html" class="text-blue-600 hover:underline mb-8 block">&larr; Back to Home</a>
        
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <h1 class="text-3xl font-bold mb-2">Contact Support</h1>
            <p class="text-slate-600 mb-8">We're here to help! Fill out the form below and we'll get back to you as soon as possible.</p>
            
            <form class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Email Address</label>
                    <input type="email" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none" placeholder="you@example.com" required>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Subject</label>
                    <select class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
                        <option>General Inquiry</option>
                        <option>Report a Bug</option>
                        <option>Account Issue</option>
                        <option>Feature Request</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Message</label>
                    <textarea class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none h-32" placeholder="How can we help you?" required></textarea>
                </div>
                
                <button type="button" onclick="alert('Support request simulated. In production, this would send an email.')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors">
                    Send Message
                </button>
            </form>

            <div class="mt-8 pt-8 border-t border-slate-100 text-center">
                <p class="text-sm text-slate-500">Or email us directly at</p>
                <a href="mailto:support@pixxy.app" class="font-semibold text-blue-600 hover:text-blue-700">support@pixxy.app</a>
            </div>
        </div>
    </div>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
